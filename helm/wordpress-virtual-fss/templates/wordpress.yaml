{{- $claim := ternary .Values.fss.existingClaim "wordpress-content" (eq .Values.fss.mode "existing-claim") }}
{{- $configSecret := default (printf "%s-config" (include "wordpress-virtual-fss.fullname" .)) .Values.wordpress.configSecret }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wordpress-virtual-fss.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app.kubernetes.io/name: {{ include "wordpress-virtual-fss.name" . }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ include "wordpress-virtual-fss.name" . }} }
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app.kubernetes.io/name: {{ include "wordpress-virtual-fss.name" . }} }
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: {{ .Values.virtualNodes.taintKey | quote }}
          operator: Equal
          value: {{ .Values.virtualNodes.taintValue | quote }}
          effect: NoSchedule
      containers:
        - name: wordpress
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{ name: http, containerPort: 80 }]
          env:
            - name: WORDPRESS_DB_HOST
              valueFrom: { secretKeyRef: { name: {{ .Values.mysql.existingSecret }}, key: host } }
            - name: WORDPRESS_DB_NAME
              valueFrom: { secretKeyRef: { name: {{ .Values.mysql.existingSecret }}, key: database } }
            - name: WORDPRESS_DB_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.mysql.existingSecret }}, key: username } }
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.mysql.existingSecret }}, key: password } }
            - name: WORDPRESS_CONFIG_EXTRA
              valueFrom: { secretKeyRef: { name: {{ $configSecret }}, key: wordpress-config-extra } }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: /wp-login.php, port: http }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /wp-login.php, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /wp-login.php, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: wordpress-content
              mountPath: /var/www/html/wp-content
      volumes:
        - name: wordpress-content
          persistentVolumeClaim: { claimName: {{ $claim }} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wordpress-virtual-fss.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  selector: { app.kubernetes.io/name: {{ include "wordpress-virtual-fss.name" . }} }
  ports: [{ name: http, port: {{ .Values.service.port }}, targetPort: http }]
