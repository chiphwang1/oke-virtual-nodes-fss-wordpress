<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">WordPress on OKE Virtual Nodes with FSS and external MySQL</title>
  <desc id="desc">An OCI load balancer distributes traffic to WordPress pods in an OKE Virtual Node pool. Pods use a PVC and PV to reach an FSS mount target and export, and connect to an external MySQL DB System.</desc>
  <style>
    .box{fill:#fff;stroke:#0b5cab;stroke-width:3}.oci{fill:#f7fbff;stroke:#006b63;stroke-width:3}.cluster{fill:#f5faff;stroke:#0b5cab;stroke-width:3;stroke-dasharray:12 8}.pod{fill:#e8f1ff;stroke:#0b5cab;stroke-width:2}.storage{fill:#faf5ff;stroke:#7047a8;stroke-width:2}.label{font:700 25px Arial,sans-serif;fill:#102a43}.small{font:19px Arial,sans-serif;fill:#243b53}.line{stroke:#0b5cab;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#7047a8;stroke-width:3;fill:none;stroke-dasharray:9 7;marker-end:url(#arrowPurple)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b5cab"/></marker><marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7047a8"/></marker></defs>
  <rect x="25" y="25" width="1550" height="850" rx="22" class="oci"/><text x="65" y="82" class="label">VCN</text>
  <rect x="70" y="130" width="910" height="680" rx="20" class="cluster"/><text x="110" y="180" class="label">OKE Enhanced Cluster</text>
  <rect x="305" y="225" width="430" height="78" rx="12" class="box"/><text x="387" y="273" class="label">Kubernetes Service</text>
  <rect x="150" y="360" width="735" height="180" rx="16" class="box"/><text x="380" y="402" class="label">Virtual Node pool</text>
  <rect x="205" y="435" width="240" height="68" rx="10" class="pod"/><text x="325" y="478" text-anchor="middle" class="label">WordPress pod 1</text>
  <rect x="580" y="435" width="240" height="68" rx="10" class="pod"/><text x="700" y="478" text-anchor="middle" class="label">WordPress pod 2</text>
  <rect x="308" y="625" width="420" height="66" rx="10" class="storage"/><text x="404" y="667" class="label">PVC and PV RWX</text>
  <text x="380" y="733" class="small">StorageClass provisions the claim</text>
  <rect x="1070" y="180" width="420" height="115" rx="14" class="oci"/><text x="1154" y="225" class="label">OCI Load Balancer</text><text x="1133" y="260" class="small">Public or private endpoint</text>
  <rect x="1070" y="390" width="420" height="150" rx="14" class="oci"/><text x="1165" y="435" class="label">FSS mount target</text><text x="1138" y="473" class="small">FSS filesystem and export</text><text x="1180" y="505" class="small">outside the OKE cluster</text>
  <rect x="1070" y="650" width="420" height="125" rx="14" class="oci"/><text x="1140" y="700" class="label">OCI MySQL DB System</text><text x="1198" y="735" class="small">Private endpoint with TLS</text>
  <path d="M1070 238 L735 258" class="line"/><path d="M445 503 L510 625" class="dash"/><path d="M700 503 L600 625" class="dash"/><path d="M728 658 L1070 465" class="dash"/><path d="M445 470 L940 590" class="line"/><path d="M820 470 L940 590" class="line"/><path d="M940 590 L1070 710" class="line"/>
  <text x="820" y="425" class="small">Pod → PVC → PV → FSS export</text><text x="850" y="640" class="small">Shared MySQL connection</text>
</svg>
