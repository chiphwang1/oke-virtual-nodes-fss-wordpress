<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">WordPress on OKE Virtual Nodes with FSS and external MySQL</title>
  <desc id="description">An OCI Load Balancer sends traffic through a Kubernetes Service to WordPress pods on two Virtual Nodes. Both pods use a shared PVC and PV connected to FSS, and both connect to an external MySQL DB System.</desc>
  <style>
    .vcn { fill:#f8fbfd; stroke:#006b63; stroke-width:3 }
    .cluster { fill:#f5faff; stroke:#0b5cab; stroke-width:3; stroke-dasharray:12 8 }
    .component { fill:#fff; stroke:#0b5cab; stroke-width:3 }
    .node { fill:#f8fbff; stroke:#4b89c8; stroke-width:2 }
    .pod { fill:#e8f1ff; stroke:#0b5cab; stroke-width:2.5 }
    .storage { fill:#faf5ff; stroke:#7047a8; stroke-width:2.5 }
    .oci { fill:#f7fbff; stroke:#006b63; stroke-width:3 }
    .heading { font:700 27px Arial,sans-serif; fill:#102a43 }
    .label { font:700 22px Arial,sans-serif; fill:#102a43 }
    .small { font:19px Arial,sans-serif; fill:#243b53 }
    .line { fill:none; stroke:#0b5cab; stroke-width:3; marker-end:url(#arrow) }
    .join { fill:none; stroke:#0b5cab; stroke-width:3 }
    .storage-line { fill:none; stroke:#7047a8; stroke-width:3; stroke-dasharray:9 7; marker-end:url(#storage-arrow) }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b5cab"/></marker>
    <marker id="storage-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7047a8"/></marker>
  </defs>

  <rect x="25" y="25" width="1550" height="850" rx="22" class="vcn"/>
  <text x="65" y="80" class="heading">VCN</text>

  <rect x="70" y="130" width="860" height="690" rx="20" class="cluster"/>
  <text x="110" y="180" class="heading">OKE Enhanced Cluster</text>

  <rect x="1080" y="215" width="400" height="86" rx="14" class="oci"/>
  <text x="1280" y="267" text-anchor="middle" class="label">OCI Load Balancer</text>

  <rect x="300" y="225" width="420" height="76" rx="12" class="component"/>
  <text x="510" y="272" text-anchor="middle" class="heading">Kubernetes Service</text>

  <rect x="130" y="360" width="770" height="240" rx="16" class="component"/>
  <text x="160" y="590" class="heading">Virtual Node pool</text>

  <rect x="170" y="415" width="300" height="145" rx="12" class="node"/>
  <rect x="560" y="415" width="300" height="145" rx="12" class="node"/>
  <rect x="200" y="445" width="240" height="62" rx="10" class="pod"/>
  <rect x="590" y="445" width="240" height="62" rx="10" class="pod"/>
  <text x="320" y="485" text-anchor="middle" class="label">WordPress pod 1</text>
  <text x="710" y="485" text-anchor="middle" class="label">WordPress pod 2</text>
  <text x="190" y="438" class="small">Virtual Node 1</text>
  <text x="580" y="438" class="small">Virtual Node 2</text>

  <rect x="300" y="670" width="430" height="66" rx="10" class="storage"/>
  <text x="515" y="712" text-anchor="middle" class="heading">PVC and PV RWX</text>
  <text x="515" y="770" text-anchor="middle" class="small">StorageClass provisions the claim</text>

  <rect x="1080" y="410" width="400" height="128" rx="14" class="oci"/>
  <text x="1280" y="458" text-anchor="middle" class="label">FSS mount target and export</text>
  <text x="1280" y="493" text-anchor="middle" class="small">FSS filesystem outside the cluster</text>

  <rect x="1080" y="655" width="400" height="110" rx="14" class="oci"/>
  <text x="1280" y="700" text-anchor="middle" class="label">OCI MySQL DB System</text>
  <text x="1280" y="733" text-anchor="middle" class="small">Private endpoint</text>

  <path d="M1080 258 L720 263" class="line"/>
  <path d="M510 301 L510 380 L320 380 L320 445" class="line"/>
  <path d="M510 380 L710 380 L710 445" class="line"/>
  <path d="M320 507 L455 670" class="storage-line"/>
  <path d="M710 507 L575 670" class="storage-line"/>
  <path d="M730 703 L1080 475" class="storage-line"/>
  <path d="M440 476 L500 476 L500 620 L940 620" class="join"/>
  <path d="M830 476 L900 476 L900 620 L940 620" class="join"/>
  <path d="M940 620 L1080 710" class="line"/>
</svg>
